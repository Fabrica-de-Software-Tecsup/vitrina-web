name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.example.invalid
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci.apps.googleusercontent.com
      NEXT_PUBLIC_STORAGE_URL: https://archivos.example.invalid
      NEXT_PUBLIC_SITE_URL: https://vitrina.example.invalid
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci rechaza en Linux un lockfile generado en macOS por las dependencias opcionales de @emnapi; npm install respeta el lock y repara.
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx eslint app components lib
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical
