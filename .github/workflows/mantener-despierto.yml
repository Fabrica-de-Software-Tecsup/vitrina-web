# Mantiene despierto el API en Render Free (se duerme a los 15 min sin tráfico).
# Llama a /health/live, que NO consulta la base de datos: así Neon puede suspenderse cuando no hay visitas y no
# se agotan sus 100 horas de cómputo gratuitas al mes (despertar Neon tarda alrededor de un segundo; despertar
# Render, hasta un minuto, que es lo que se quiere evitar).
# Este repo es público, así que los minutos de Actions no se descuentan. GitHub puede retrasar los crons unos
# minutos en horas de carga; con */5 queda margen frente a los 15 de Render.
name: Mantener despierto el API
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Llamar a /health/live (sin base de datos)
        run: |
          API=https://vitrina-api-3fue.onrender.com
          for i in 1 2 3; do
            # La raíz (/) tampoco toca la base: sirve de respaldo si /health/live aún no está desplegado.
            if curl -fsS --max-time 60 "$API/health/live" || curl -fsS --max-time 60 "$API/"; then echo; exit 0; fi
            sleep 20
          done
          echo "El API no respondió tras 3 intentos"; exit 1
